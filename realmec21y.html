<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>realmeC21Y</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .card {
      width: 90%;
      max-width: 360px;
      margin: 20px auto;
      padding: 18px;
      background: rgba(0, 0, 0, .7);
      border: 2px solid #ff0000;
      border-radius: 18px;
      box-shadow: 0 0 15px red;
      color: white;
    }

    .item {
      background: rgba(255, 255, 255, .08);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 18px;
    }

    .aim {
      background: #ff0000;
      color: white;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="title">Realme C21Y</div>

  <div class="card">
    <div class="item">Sensitivity : High</div>
    <div class="item">General : 120</div>
    <div class="item">Red Dot : 176</div>
    <div class="item">2X Scope : 112</div>
    <div class="item">4X Scope : 101</div>
    <div class="item">Sniper : 146</div>
    <div class="item">Free Look : 07</div>
    <div class="item">DPI : 987</div>
    <div class="item aim">Aim Button : 61%</div>
  </div>

  <div class="menu">
    <!-- تم تصحيح اسم الملف إلى realme.html بحروف صغيرة -->
    <button onclick="window.location.href='realme.html'">⬅ رجوع</button>
  </div>

</body>
</html>
