<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy s22</title>
<link rel="stylesheet" href="style.css">

<style>
.card{
width:90%;
max-width:360px;
margin:20px auto;
padding:18px;
background:rgba(0,0,0,.7);
border:2px solid #ff0000;
border-radius:18px;
box-shadow:0 0 15px red;
color:white;
}

.item{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:12px;
margin-bottom:10px;
font-size:18px;
}

.aim{
background:#ff0000;
color:white;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<div class="title">Galaxy s22</div>

<div class="card">

<div class="item">Sensitivity : High</div>

<div class="item">General : 196</div>

<div class="item">Red Dot : 156</div>

<div class="item">2X Scope : 1780</div>

<div class="item">4X Scope : 192</div>

<div class="item">Sniper : 178</div>

<div class="item">Free Look : 112</div>

<div class="item">DPI : 430</div>

<div class="item aim">Aim Button : 43%</div>

</div>

<div class="menu">
<button onclick="window.location='samsung.html'">⬅ رجوع</button>
</div>

</body>
</html>
