<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy A15</title>
<link rel="stylesheet" href="style.css">
<style>
.card{
width:90%;
max-width:360px;
margin:20px auto;
padding:18px;
background:rgba(0,0,0,.7);
border:2px solid #ff0000;
border-radius:18px;
box-shadow:0 0 15px red;
color:white;
}

.card h2{
text-align:center;
margin-bottom:16px;
color:#fff;
}

.item{
background:rgba(255,255,255,.08);
padding:12px;
border-radius:12px;
margin-bottom:10px;
font-size:18px;
}

.small{
font-size:16px;
opacity:.9;
}

.aim{
background:#ff0000;
color:white;
font-weight:bold;
text-align:center;
}
</style>
</head>
<body>

<div class="title">Galaxy A15</div>

<div class="card">
  <div class="item">Sensitivity: <b>High</b></div>
  <div class="item">General: <b>180</b></div>
  <div class="item">Red Dot: <b>190</b></div>
  <div class="item">2X Scope: <b>178</b></div>
  <div class="item">4X Scope: <b>174</b></div>
  <div class="item">Sniper: <b>165</b></div>
  <div class="item">Free Look: <b>180</b></div>
  <div class="item">DPI: <b>450</b></div>
  <div class="item aim">Aim Button: <b>Size 45% / Left 55% / Up 72%</b></div>
</div>

<div class="menu">
  <button onclick="window.location='samsung.html'">⬅ رجوع</button>
</div>

</body>
</html>
